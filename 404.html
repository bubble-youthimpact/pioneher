<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Pioneher</title><meta name="robots" content="noindex">
<script>
  // Static hosts (GitHub Pages, Netlify…) serve this for unknown URLs. Hand the path to the app.
  (function(){ var l=window.location, p=l.pathname.replace(/\/+$/,"")||"/";
    l.replace("/?p="+encodeURIComponent(p+l.search)+l.hash); })();
</script></head><body></body></html>
